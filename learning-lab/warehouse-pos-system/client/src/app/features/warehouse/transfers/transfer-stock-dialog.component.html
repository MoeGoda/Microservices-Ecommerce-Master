<h2 mat-dialog-title>{{ 'transfers.create.title' | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <div class="form-grid">
      <app-searchable-select
        class="span-2"
        [label]="'transfers.create.item' | translate"
        formControlName="itemId"
        [options]="items()"
        [optionLabel]="itemLabel"
        [optionValue]="itemValue"
      ></app-searchable-select>

      <app-searchable-select
        [label]="'transfers.create.fromLocation' | translate"
        formControlName="fromLocationId"
        [options]="locations()"
        [optionLabel]="locationLabel"
        [optionValue]="locationValue"
      ></app-searchable-select>

      <app-searchable-select
        [label]="'transfers.create.toLocation' | translate"
        formControlName="toLocationId"
        [options]="locations()"
        [optionLabel]="locationLabel"
        [optionValue]="locationValue"
      ></app-searchable-select>
      @if (form.controls.toLocationId.hasError('sameLocation')) {
        <div class="span-2 form-error">{{ 'transfers.create.sameLocation' | translate }}</div>
      }

      <mat-form-field appearance="outline">
        <mat-label>{{ 'transfers.create.quantity' | translate }}</mat-label>
        <input matInput type="number" step="0.0001" formControlName="quantity" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ 'transfers.create.reference' | translate }}</mat-label>
        <input matInput formControlName="reference" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>{{ 'common.cancel' | translate }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
      } @else {
        {{ 'transfers.create.submit' | translate }}
      }
    </button>
  </mat-dialog-actions>
</form>
