server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every deep link (e.g. /admin, /pos) is a client-side
    # Angular route, not a real file on disk; nginx has to serve
    # index.html for any path it doesn't otherwise recognize and let the
    # Angular router take it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
