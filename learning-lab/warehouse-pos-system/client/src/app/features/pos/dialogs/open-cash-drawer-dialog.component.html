<h2 mat-dialog-title>{{ 'pos.cashDrawer.open.title' | translate }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'pos.cashDrawer.open.openingFloat' | translate }}</mat-label>
      <input matInput type="number" step="0.01" min="0" formControlName="openingFloat" />
      @if (form.controls.openingFloat.touched && form.controls.openingFloat.invalid) {
        <mat-error>{{ 'pos.cashDrawer.open.openingFloatRequired' | translate }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>{{ 'common.cancel' | translate }}</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
      } @else {
        {{ 'pos.cashDrawer.open.submit' | translate }}
      }
    </button>
  </mat-dialog-actions>
</form>
