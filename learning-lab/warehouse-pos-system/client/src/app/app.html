<mat-toolbar color="primary">
  <span>Warehouse &amp; POS</span>
  @if (authService.currentUser()) {
    <a mat-button routerLink="/admin" routerLinkActive="active-nav-link">Admin</a>
    <a mat-button routerLink="/pos" routerLinkActive="active-nav-link">POS</a>
  }
  <span class="spacer"></span>
  @if (authService.currentUser(); as user) {
    <span class="user-badge">{{ user.userName }} ({{ user.role }})</span>
    <button mat-icon-button (click)="logout()" aria-label="Sign out" title="Sign out">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<router-outlet></router-outlet>
